# render.yaml — Render Blueprint for one-click deploy.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ecoloop
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && mkdir -p storage/uploads
    startCommand: python app.py
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: COMMUNITY_NAME
        value: "Springdale Community"
      - key: COLLECTION_POINT
        value: "School exchange desk · weekdays, 12–2 pm"
      - key: DATA_PATH
        value: storage/ecoloop.json
      - key: UPLOAD_DIR
        value: storage/uploads
      - key: DEMO_MODE
        value: "0"
      - key: SITE_URL
        sync: false          # User must set this to their Render URL
      - key: SECURE_COOKIES
        value: "1"
