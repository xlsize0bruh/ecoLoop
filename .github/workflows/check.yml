name: Python and PHP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q app.py bridge.py manage.py wsgi.py ecoloop tests
      - name: Require and lint PHP gateway
        run: |
          php --version
          php -l public/index.php
          php -l php-config.example.php
      - name: Test JSON workflows and both HTTP entry points
        run: python -m unittest discover -s tests -v
